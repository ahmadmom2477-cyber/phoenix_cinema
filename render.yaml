services:
  - type: web
    name: phoenix-cinema
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      npm install -g pnpm@10 &&
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/am-cinema run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: ENABLE_DOWNLOADS
        value: true
      - key: PHOENIX_SUB_SECRET
        sync: false
      - key: PHOENIX_ADMIN_PASS
        sync: false
